name: build

# Every pull request and every push to main: unit tests, the Windows build, the self-test on the real
# .NET Framework and pictures of the window (artifact "snapshots"); the Linux AppImage with its own
# self-test and pictures (artifact "snapshots-linux").
# A push to main whose <Version> in src/Directory.Build.props is newer than the newest release also
# publishes it: the release is made as a draft, gets the exe, the AppImage and their checksums, and is
# only then published, so the updater never sees a half-finished release. The exe is code-signed when the
# repository has code signing set up (SIGNING.md), and public releases get build provenance for both files.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      HAS_SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: version
        run: |
          $xml = [xml](Get-Content src/Directory.Build.props)
          $v = ($xml.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ }) | Select-Object -First 1
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Version in src/Directory.Build.props must be x.y.z, got '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Unit tests
        run: dotnet test tests/EldoUI.Updater.Tests -c Release --nologo

      - name: Build the exe
        run: dotnet build src/EldoUI.Updater -c Release --nologo

      # Code signing through SignPath (free for open-source projects), when the repository has it set up:
      # the secret SIGNPATH_API_TOKEN and the variables SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG and
      # SIGNPATH_POLICY_SLUG. Without them the exe stays unsigned and nothing else changes.
      - uses: actions/upload-artifact@v7
        id: unsigned
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        with:
          name: EldoUI-Updater-unsigned
          path: src/EldoUI.Updater/bin/Release/net48/EldoUI Updater.exe
          retention-days: 1

      - name: Sign the exe
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed exe
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        run: |
          $signed = Get-ChildItem signed -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $signed) { throw "the signed exe is missing" }
          $sig = Get-AuthenticodeSignature $signed.FullName
          if ($sig.Status -ne 'Valid') { throw "the signature is not valid: $($sig.Status)" }
          Copy-Item $signed.FullName "src/EldoUI.Updater/bin/Release/net48/EldoUI Updater.exe" -Force
          Write-Host "Signed by $($sig.SignerCertificate.Subject)"

      - name: Self-test on .NET Framework
        run: |
          $exe = "src/EldoUI.Updater/bin/Release/net48/EldoUI Updater.exe"
          $p = Start-Process $exe -ArgumentList "--selftest" -Wait -PassThru -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }

      - name: Pictures of the window
        timeout-minutes: 5
        run: |
          $exe = "src/EldoUI.Updater/bin/Release/net48/EldoUI Updater.exe"
          $p = Start-Process $exe -ArgumentList "--snapshot", "snapshots" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "snapshot failed ($($p.ExitCode))" }
          Get-ChildItem snapshots | Format-Table Name, Length

      - name: Stage the release file
        run: |
          New-Item -ItemType Directory -Force publish | Out-Null
          Copy-Item "src/EldoUI.Updater/bin/Release/net48/EldoUI Updater.exe" publish/EldoUI-Updater.exe
          $hash = (Get-FileHash publish/EldoUI-Updater.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  EldoUI-Updater.exe" | Out-File -Encoding ascii publish/SHA256SUMS.txt
          foreach ($lang in @("en", "da")) {
            Copy-Item "snapshots/window-uptodate-$lang.png" "publish/updater-windows-$lang.png" -ErrorAction Stop
          }
          Get-Content publish/SHA256SUMS.txt
          Write-Host "Size: $((Get-Item publish/EldoUI-Updater.exe).Length) bytes"

      - uses: actions/upload-artifact@v7
        with:
          name: snapshots
          path: snapshots/*.png
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: EldoUI-Updater
          path: publish/*
          retention-days: 14

  linux:
    name: Build the AppImage (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Unit tests (with the Linux-only Wine tests)
        run: dotnet test tests/EldoUI.Updater.Tests -c Release --nologo

      - name: Tools for the AppImage
        run: sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils

      - name: Build the AppImage
        run: bash packaging/linux/build-appimage.sh publish

      - name: Self-test of the AppImage
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./publish/EldoUI-Updater-x86_64.AppImage --selftest

      - name: Pictures of the window
        timeout-minutes: 5
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./publish/EldoUI-Updater-x86_64.AppImage --snapshot snapshots
          ls -l snapshots

      - name: Stage release previews
        run: |
          for lang in en da; do
            cp "snapshots/linux-uptodate-$lang.png" "publish/updater-linux-$lang.png"
          done

      - name: Checksum
        run: |
          cd publish
          sha256sum EldoUI-Updater-x86_64.AppImage > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v7
        with:
          name: snapshots-linux
          path: snapshots/*.png
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: EldoUI-Updater-Linux
          path: publish/*
          retention-days: 14

  release:
    name: Publish ${{ needs.build.outputs.version }}
    needs: [build, linux]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: a signed statement that this workflow built the release files.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Only a version newer than the newest release
        id: guard
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          latest="${latest#v}"
          echo "Newest release: ${latest:-none}, this build: $VERSION"
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -1)" = "$latest" ]; then
            echo "Not newer: nothing to publish (raise <Version> in src/Directory.Build.props to release)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.guard.outputs.publish == 'true'
        with:
          name: EldoUI-Updater
          path: publish

      - uses: actions/download-artifact@v4
        if: steps.guard.outputs.publish == 'true'
        with:
          name: EldoUI-Updater-Linux
          path: publish-linux

      - name: One checksum file for both
        if: steps.guard.outputs.publish == 'true'
        run: |
          mv publish-linux/EldoUI-Updater-x86_64.AppImage publish/
          mv publish-linux/updater-linux-*.png publish/
          sed -i "s/\r$//" publish/SHA256SUMS.txt
          cat publish-linux/SHA256SUMS-linux.txt >> publish/SHA256SUMS.txt
          (cd publish && sha256sum -c SHA256SUMS.txt)

      - name: Build provenance
        # GitHub offers attestations for public repositories.
        if: steps.guard.outputs.publish == 'true' && !github.event.repository.private
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            publish/EldoUI-Updater.exe
            publish/EldoUI-Updater-x86_64.AppImage

      - name: Release notes
        if: steps.guard.outputs.publish == 'true'
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $VERSION"; exit 1; fi
          cat notes.md

      - name: Draft, upload, then publish
        if: steps.guard.outputs.publish == 'true'
        run: |
          # A draft left by an earlier failed try of this version starts over; a published release is never deleted.
          if [ "$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "v$VERSION" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft \
            --title "EldoUI Updater $VERSION" --notes-file notes.md --target "$GITHUB_SHA" \
            publish/EldoUI-Updater.exe publish/EldoUI-Updater-x86_64.AppImage publish/SHA256SUMS.txt publish/updater-*.png
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
